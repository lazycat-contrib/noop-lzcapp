application:
  subdomain: noop
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://noop:8787/
services:
  noop:
    # ghcr.io/dockers-x/noop:latest (auto-built from huacnlee/noop)
    image: ghcr.1ms.run/dockers-x/noop:latest
    environment:
      - NOOP_HOME=/lzcapp/var/noop
      - HUB_DATA=/lzcapp/var/noop/data
      - HUB_HOST=lazycat
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/noop:/lzcapp/var/noop
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8787/
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
usage: |
  Noop 是跑在自己机器上的 AI 团队：一支 Claude Code / Codex 代理小队，
  把目标拆解成并行任务、学习你的决策方式，只在真正需要你时才来问你。

  首次启动：
  1. 在懒猫微服打开本应用，等待 daemon 就绪。
  2. 进入应用终端（懒猫应用详情里的「终端」入口），登录你的 AI 账号：
     运行 claude（按提示登录 Anthropic 账号）或 codex login（ChatGPT 账号）
     ——agent 用这个账号的额度干活。
  3. Web 聊天页用「机器 token」登录：token 在应用数据目录的 noop.toml 文件
     （[server] token 字段），浏览器打开地址后粘贴即可。
  4. 之后直接在聊天框里说目标即可。

  说明：
  - 本打包为本地模式：聊天 API 与数据全部在本机，不依赖 Cloudflare。
    如需多设备协调 / 邮箱验证码登录，可在终端先 bunx wrangler login 登录你的
    Cloudflare 账号，再运行 noop init --primary（会去掉本地模式开关并部署你自己的
    Worker，免费额度即可）。
  - 硬门禁：merge、release、push main 等不可逆操作一律需要你在卡片里批准；
    rm -rf、仓库删除、密钥管理永远被禁止。
  - agent 任务的工作目录默认在应用数据目录下，重启不丢失。
